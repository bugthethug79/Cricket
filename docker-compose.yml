# Quickly setup a Cricket server!
# Though mainly used for development purposes there is no reason you cannot use this!

services:
  cricket:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN_ADDR: 127.0.0.1:8080
      TRUST_PROXY: "true"
      PUBLIC_IP: ${PUBLIC_IP:?set PUBLIC_IP in .env}
      TURN_HOST: ${DOMAIN:?set DOMAIN in .env}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
      FORCE_RELAY: ${FORCE_RELAY:-false}
      CREATE_TOKEN: ${CREATE_TOKEN:-}
      MAX_PEERS_PER_ROOM: ${MAX_PEERS_PER_ROOM:-12}
      MAX_ROOMS: ${MAX_ROOMS:-1000}
      MAX_ROOMS_PER_IP: ${MAX_ROOMS_PER_IP:-20}
      ROOM_EMPTY_TTL: ${ROOM_EMPTY_TTL:-5m}
      BAN_BY_IP: ${BAN_BY_IP:-true}
      CREATE_RATE_PER_MIN: ${CREATE_RATE_PER_MIN:-10}
      CREATE_BURST: ${CREATE_BURST:-5}
      JOIN_RATE_PER_MIN: ${JOIN_RATE_PER_MIN:-30}
      JOIN_BURST: ${JOIN_BURST:-15}
      IPV6_PREFIX_LEN: ${IPV6_PREFIX_LEN:-64}
      MAX_CONNS: ${MAX_CONNS:-2000}
      MAX_CONNS_PER_IP: ${MAX_CONNS_PER_IP:-20}
      SIGNAL_RATE_PER_SEC: ${SIGNAL_RATE_PER_SEC:-20}
      SIGNAL_BURST: ${SIGNAL_BURST:-200}
      TURN_BIND_IP: ${TURN_BIND_IP:-true}
      TURN_MAX_ALLOCS_PER_CRED: ${TURN_MAX_ALLOCS_PER_CRED:-16}
      TURN_MAX_ALLOCS_PER_IP: ${TURN_MAX_ALLOCS_PER_IP:-32}

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
