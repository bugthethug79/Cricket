<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Cricket</title>
  <meta name="theme-color" content="#3584e4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#222226" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cricket">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<!-- Landing: create a room -->
<section id="landing" class="screen window" hidden>
  <header class="headerbar flat"><span class="hb-title">Cricket</span></header>
  <div class="status-page">
    <div class="status-icon">
      <span class="icon ic-video"></span>
    </div>
    <h1 class="title-1">Private Rooms</h1>
    <p class="body dim">Voice, video, screen sharing and chat.</p>

    <div class="clamp">
      <div id="tokenRow" class="boxed-list" hidden>
        <label class="row entry-row">
          <span class="row-title">Creation Token</span>
          <input id="createToken" type="password" autocomplete="off" placeholder="Required by this server">
        </label>
      </div>
      <button id="createBtn" class="btn pill suggested">Create Room</button>
      <p id="landingErr" class="error" hidden></p>
    </div>
  </div>
</section>

<!-- Pre-join: pick a name -->
<section id="prejoin" class="screen window" hidden>
  <header class="headerbar flat"><span class="hb-title">Cricket</span></header>
  <form id="joinForm" class="status-page">
    <div class="status-icon">
      <span class="icon ic-user"></span>
    </div>
    <h1 class="title-1">Join Room</h1>
    <p class="body dim">Please choose yourself a name.</p>
    <div class="clamp">
      <div class="boxed-list">
        <label class="row entry-row">
          <span class="row-title">Name</span>
          <input id="nameInput" maxlength="32" autocomplete="nickname" placeholder="Guest" required>
        </label>
        <div class="row">
          <span class="row-title">Color</span>
          <div id="colorPicker" class="colors" role="group" aria-label="Avatar color"></div>
        </div>
      </div>
      <button class="btn pill suggested" type="submit">Join</button>
      <p id="joinErr" class="error" hidden></p>
    </div>
  </form>
</section>

<!-- Call -->
<section id="call" class="screen" hidden>
  <div class="stage">
    <header class="headerbar">
      <span class="hb-start"></span>
      <div class="hb-center">
        <span class="hb-title">Cricket</span>
        <span id="count" class="hb-subtitle">1 in call</span>
      </div>
      <div class="hb-end">
        <button id="copyLink" class="btn flat circular" title="Copy Invite Link">
          <span class="icon ic-link"></span>
        </button>
      </div>
    </header>
    <div id="audioHint" class="banner" hidden>
      <span>Audio is blocked by your browser</span>
      <button id="audioUnlock" class="btn suggested">Enable Audio</button>
    </div>
    <div id="tiles" class="tiles"></div>
    <footer class="controls">
      <button id="micBtn" class="ctl" title="Microphone (M)"><span class="ic"></span><span class="lbl">Mic</span></button>
      <button id="camBtn" class="ctl" title="Camera (V)"><span class="ic"></span><span class="lbl">Camera</span></button>
      <button id="screenBtn" class="ctl" title="Share Screen"><span class="ic"></span><span class="lbl">Share</span></button>
      <button id="panelBtn" class="ctl" title="People and Chat"><span class="ic"></span><span class="lbl">Chat</span><span id="unread" class="badge" hidden></span></button>
      <button id="leaveBtn" class="ctl danger" title="Leave"><span class="ic"></span><span class="lbl">Leave</span></button>
    </footer>
  </div>
  <aside id="panel" class="panel">
    <header class="headerbar tabs">
      <div class="linked switcher">
        <button class="tab active" data-tab="people">People</button>
        <button class="tab" data-tab="chat">Chat <span id="tabUnread" class="unread" hidden></span></button>
      </div>
      <button id="panelClose" class="btn flat circular close" title="Close">
        <span class="icon ic-close"></span>
      </button>
    </header>
    <div class="people-wrap">
      <ul id="people" class="boxed-list people"></ul>
    </div>
    <div id="chat" class="chat" hidden>
      <div id="messages" class="messages">
        <p class="sys">Messages are end-to-end encrypted and disappear when you leave.</p>
      </div>
      <form id="chatForm" class="composer">
        <input id="chatInput" maxlength="2000" autocomplete="off" placeholder="Message">
        <button class="btn suggested circular" type="submit" title="Send">
          <span class="icon ic-send"></span>
        </button>
      </form>
    </div>
  </aside>
</section>

<!-- Ended / errors -->
<section id="ended" class="screen window" hidden>
  <header class="headerbar flat"><span class="hb-title">Cricket</span></header>
  <div class="status-page">
    <div class="status-icon">
      <span class="icon ic-leave"></span>
    </div>
    <h1 id="endedTitle" class="title-1">You left the room</h1>
    <p id="endedMsg" class="body dim"></p>
    <div class="clamp">
      <button id="rejoinBtn" class="btn pill suggested">Rejoin</button>
      <a href="/" class="btn pill">New Room</a>
    </div>
  </div>
</section>

<div id="toast" class="toast" hidden></div>
<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
